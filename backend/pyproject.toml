[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frontend-job-finder"
version = "0.1.0"
description = "Local, resilient frontend vacancy aggregator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "playwright>=1.46,<2",
  "pypdf>=5,<7",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
]

[project.scripts]
job-finder = "job_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
